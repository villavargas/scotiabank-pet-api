petstore.base-url=https://petstore.swagger.io/v2
petstore.connect-timeout=5000
petstore.read-timeout=10000

# Actuator — solo exponer health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Logging — incluir correlationId en cada linea de log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n
